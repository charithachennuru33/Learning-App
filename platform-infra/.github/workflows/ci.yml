name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: platform_infra
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform_infra"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/platform_infra
          DB_USERNAME: platform
          DB_PASSWORD: platform
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-only-secret-key-that-is-long-enough-123456
