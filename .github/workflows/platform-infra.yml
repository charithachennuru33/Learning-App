name: platform-infra

on:
  pull_request:
    paths: ["platform-infra/**", ".github/workflows/platform-infra.yml"]
  push:
    branches: ["main", "develop"]
    paths: ["platform-infra/**", ".github/workflows/platform-infra.yml"]

defaults:
  run:
    working-directory: platform-infra

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: platform-infra/pom.xml
      # Integration tests start PostgreSQL and Redis with Testcontainers using the runner's Docker.
      - name: Build and test
        run: mvn -B verify
      - name: Build image
        run: docker build -t platform-infra:${{ github.sha }} .
