services:
  postgres:
    image: postgres:17
    container_name: platform-infra-postgres
    environment:
      POSTGRES_DB: platform_infra
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - platform_infra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_infra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: platform-infra-redis
    ports:
      - "6379:6379"
    volumes:
      - platform_infra_redis:/data

volumes:
  platform_infra_postgres:
  platform_infra_redis:
