# Local development only. Never activate this profile in a shared or production environment.
spring:
  datasource:
    password: ${DB_PASSWORD:platform}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}

platform:
  auth:
    otp:
      secret: ${OTP_SECRET:dev-only-otp-secret-change-me-0123456789abcdef}
  sms:
    provider: ${SMS_PROVIDER:logging}
    logging:
      log-otp: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
