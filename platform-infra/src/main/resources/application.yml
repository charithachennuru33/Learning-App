# Production-safe defaults. Secrets have no defaults on purpose: the app will not start without them.
# Local development: run with the "dev" profile (application-dev.yml).
spring:
  application:
    name: platform-infra

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform_infra}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000 # ms

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Set to "native" behind a trusted proxy/load balancer so client IPs (rate limits, audit) are correct.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    issuer: ${JWT_ISSUER:platform-infra}
    audience: ${JWT_AUDIENCE:platform-clients}
    # >= 32 bytes. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    # Comma-separated secrets still accepted for verification during key rotation.
    previous-secrets: ${JWT_PREVIOUS_SECRETS:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    clock-skew: PT30S

platform:
  auth:
    default-region: ${AUTH_DEFAULT_REGION:IN}
    otp:
      # >= 32 characters, different from JWT_SECRET.
      secret: ${OTP_SECRET}
      ttl: PT5M
      length: 6
      max-attempts: 5
      resend-cooldown: PT60S
      max-requests-per-phone-per-hour: 5
      max-requests-per-ip-per-hour: 30
      max-verifications-per-ip-per-hour: 60
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
      max-refreshes-per-ip-per-hour: 300
  sms:
    # msg91 | twilio | logging (dev only). Empty means no SmsGateway bean, so startup fails.
    provider: ${SMS_PROVIDER:}
    message-template: "%s is your verification code. Do not share it with anyone."
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      # DLT-approved template created in the MSG91 panel, e.g. "##otp## is your verification code..."
      template-id: ${MSG91_TEMPLATE_ID:}
      # Name of the template variable that receives the code (##otp## -> otp).
      otp-variable: ${MSG91_OTP_VARIABLE:otp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
