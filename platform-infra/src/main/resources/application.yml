spring:
  application:
    name: platform-infra

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform_infra}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    # Replace in every non-local environment with a secret >= 32 bytes.
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-please-123456789}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
