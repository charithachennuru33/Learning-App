# Local development dependencies only. Credentials here are for localhost and must not be reused elsewhere.
services:
  postgres:
    image: postgres:17
    container_name: platform-infra-postgres
    environment:
      POSTGRES_DB: platform_infra
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports: ["127.0.0.1:5432:5432"]
    volumes: [platform_infra_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_infra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: platform-infra-redis
    ports: ["127.0.0.1:6379:6379"]
    volumes: [platform_infra_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platform_infra_postgres:
  platform_infra_redis:
